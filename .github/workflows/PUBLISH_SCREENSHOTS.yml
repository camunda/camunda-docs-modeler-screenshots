name: Publish Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-screenshots
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - name: Resolve latest stable Desktop Modeler once
      id: version
      run: |
        node -e "require('./lib/helper/helper').fetchLatestModelerVersion().then(version => { if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected stable release'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n'); })"
    - uses: bpmn-io/actions/setup@latest
    - name: Prepare Camunda 8 cluster
      run: npm run prepare-cluster
      env:
        CAMUNDA_CONSOLE_CLIENT_ID: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_ID }}
        CAMUNDA_CONSOLE_CLIENT_SECRET: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_SECRET }}
        CAMUNDA_CLUSTER_ID: ${{ secrets.CAMUNDA_CLUSTER_ID }}
    - name: Generate all screenshots
      run: xvfb-run npm run start:ci
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CLUSTER_URL: ${{ secrets.CLUSTER_URL }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        OAUTH_URL: ${{ secrets.OAUTH_URL }}
        MAX_PARALLEL_EXECUTIONS: 5
    - name: Record version and complete artifact inventory
      run: node scripts/publish-screenshots.js record
      env:
        VERSION: ${{ steps.version.outputs.version }}
    - uses: actions/upload-artifact@v4
      with:
        name: camunda-docs
        path: camunda-docs
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: camunda-docs-static
        path: camunda-docs-static
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: camunda-docs-manual
        path: camunda-docs-manual
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: screenshot-provenance
        path: screenshot-provenance.json
        if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: screenshot-publishing
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Download artifacts from this exact successful generation job
      uses: actions/download-artifact@v4
      with:
        path: generated
    - name: Validate and prepare all three repositories before publishing
      id: prepare
      run: node scripts/publish-screenshots.js prepare
      env:
        GH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        VERSION: ${{ needs.generate.outputs.version }}
    - name: Propose Camunda 8 screenshots
      id: docs
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        path: targets/camunda-docs
        base: ${{ fromJSON(steps.prepare.outputs.bases).camunda-docs }}
        branch: automation/modeler-screenshots-${{ needs.generate.outputs.version }}
        title: 'docs(modeler): refresh Desktop Modeler screenshots'
        commit-message: 'docs(modeler): refresh screenshots across active documentation versions'
        body-path: publishing-bodies/camunda-docs.md
        draft: true
        labels: low prio
    - name: Propose Camunda 7 static screenshots
      id: static
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        path: targets/camunda-docs-static
        base: ${{ fromJSON(steps.prepare.outputs.bases).camunda-docs-static }}
        branch: automation/modeler-screenshots-${{ needs.generate.outputs.version }}
        title: 'docs(modeler): refresh Desktop Modeler screenshots'
        commit-message: 'docs(modeler): refresh Desktop Modeler screenshots'
        body-path: publishing-bodies/camunda-docs-static.md
        draft: true
    - name: Propose Camunda 7 manual screenshots
      id: manual
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        path: targets/camunda-docs-manual
        base: ${{ fromJSON(steps.prepare.outputs.bases).camunda-docs-manual }}
        branch: automation/modeler-screenshots-${{ needs.generate.outputs.version }}
        title: 'docs(modeler): refresh Desktop Modeler screenshots'
        commit-message: 'docs(modeler): refresh Desktop Modeler screenshots'
        body-path: publishing-bodies/camunda-docs-manual.md
        draft: true
    - name: Report publication results, including partial failure
      if: always()
      env:
        PREPARE: ${{ steps.prepare.outcome }}
        DOCS: ${{ steps.docs.outcome }}
        DOCS_URL: ${{ steps.docs.outputs.pull-request-url }}
        STATIC: ${{ steps.static.outcome }}
        STATIC_URL: ${{ steps.static.outputs.pull-request-url }}
        MANUAL: ${{ steps.manual.outcome }}
        MANUAL_URL: ${{ steps.manual.outputs.pull-request-url }}
      run: |
        node - <<'NODE'
        const fs = require('node:fs');
        const env = process.env;
        const lines = [
          '## Publishing results',
          `Preparation: ${env.PREPARE}`,
          ...['DOCS', 'STATIC', 'MANUAL'].map(key => `${key}: ${env[key]} ${env[key + '_URL'] || '(no PR URL; inspect step for no changes or failure)'}`),
          'Cross-repository publication is not atomic. After a partial failure, inspect existing PRs and rerun after fixing the cause.'
        ];
        fs.appendFileSync(env.GITHUB_STEP_SUMMARY, lines.join('\n\n') + '\n');
        NODE
