name: Generate Screenshots
on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop Modeler version (leave empty for latest)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Desktop Modeler version (leave empty for latest)
        required: false
        type: string
      record_provenance:
        description: Record and upload provenance for a pinned version
        required: false
        type: boolean
        default: false
    secrets:
      CAMUNDA_CONSOLE_CLIENT_ID:
        required: true
      CAMUNDA_CONSOLE_CLIENT_SECRET:
        required: true
      CAMUNDA_CLUSTER_ID:
        required: true
      CLUSTER_URL:
        required: true
      CLIENT_ID:
        required: true
      CLIENT_SECRET:
        required: true
      OAUTH_URL:
        required: true
  push:

jobs:
  create_screenshots:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Project setup
      uses: bpmn-io/actions/setup@latest
    - name: Prepare Camunda 8 cluster
      run: npm run prepare-cluster
      env:
        CAMUNDA_CONSOLE_CLIENT_ID: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_ID }}
        CAMUNDA_CONSOLE_CLIENT_SECRET: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_SECRET }}
        CAMUNDA_CLUSTER_ID: ${{ secrets.CAMUNDA_CLUSTER_ID }}
    - name: Take Screenshots
      run: xvfb-run npm run start:ci
      env:
        CLUSTER_URL: ${{ secrets.CLUSTER_URL }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        OAUTH_URL: ${{ secrets.OAUTH_URL }}
        MAX_PARALLEL_EXECUTIONS: 5
        VERSION: ${{ inputs.version }}
    - name: Record pinned version and artifact inventory
      if: ${{ inputs.record_provenance }}
      run: node scripts/publish-screenshots.js record
      env:
        VERSION: ${{ inputs.version }}
    - name: Archive Camunda 8 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camunda-docs
        path: camunda-docs
    - name: Archive Camunda 7 (manual) artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camunda-docs-manual
        path: camunda-docs-manual
    - name: Archive Camunda 7 (static) artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camunda-docs-static
        path: camunda-docs-static
    - name: Archive screenshot provenance
      if: ${{ inputs.record_provenance }}
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-provenance
        path: screenshot-provenance.json
        if-no-files-found: error
